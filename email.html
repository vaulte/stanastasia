<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Email</title>
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/browser.css">
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body>
  <div class="desktop">
    <div class="browser">
      <div class="tabs">
        <div class="tab active">
          <div class="icon"></div>
          <span>Student Email</span>
          <span class="close">✕</span>
        </div>
        <div class="new-tab">+</div>
      </div>
      <div class="toolbar">
        <a class="navbtn" href="index.html" aria-label="Back to new tab"></a>
        <button class="navbtn" type="button" onclick="location.reload()" aria-label="Reload">↻</button>
        <button class="navbtn" type="button" onclick="history.back()" aria-label="Back">‹</button>
        <div class="addressbar">mail.ravenswood.edu</div>
      </div>
      <div class="viewport">
        <main class="new-tab-content">
          <div class="new-tab-header">
            <div class="new-tab-logo">
              <div class="internet-globe">🌐</div>
              <div>
                <h1>Ravenswood Internet</h1>
                <p>University information network</p>
              </div>
            </div>
          </div>

          <section class="web-search">
            <h2>Ravenswood Student Email</h2>
            <p style="font-size:13px;color:#555;line-height:1.6;">University correspondence and student mail.</p>
            <p style="margin-top:15px;"><a href="index.html">← Return to New Tab</a></p>
          </section>
        </main>
      </div>
    </div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
